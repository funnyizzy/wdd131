<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Book</title>

<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

<meta property="og:type" content="website">
<meta property="og:title" content="Recipe Book">
<meta property="og:description" content="Simple responsive recipe layout">
<meta property="og:url" content="https://funnyizzy.github.io/wdd131/recipes/">

<link rel="stylesheet" href="styles.css">
<script src="main.js" type="module"></script>
</head>

<body>

<header class="header">
  <div class="logo-title">
    <img src="images/recipe-book-logo.png" alt="Recipe Book Logo">
    <h1>RecipeBook</h1>
  </div>
</header>

<main>
  <form class="search" id="search-form">
    <input id="search-input" type="text" placeholder="Find a recipe" aria-label="Search recipes">
    <button type="submit" aria-label="Search">
      <img src="images/search.png" alt="search icon">
    </button>
  </form>

  <section id="recipe-container"></section>
</main>

<footer>
  <a href="https://www.flaticon.com/free-icons/recipe">
    Recipe icons created by Freepik - Flaticon
  </a>

  <div class="social">
    <a href="#"><img src="images/instagram_icon.png" alt="instagram"></a>
    <a href="#"><img src="images/youtube_icon.png" alt="youtube"></a>
    <a href="#"><img src="images/pinterest_icon.png" alt="pinterest"></a>
  </div>
</footer>

</body>
</html>
