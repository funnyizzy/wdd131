<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Book</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Recipe Book">
<meta property="og:description" content="Simple responsive recipe layout">
<meta property="og:url" content="https://yourgithubusername.github.io/wdd131/recipes/">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
<div class="logo-title">
<img src="images/recipe-book-logo.png" alt="Recipe Book Logo">
<h1>RecipeBook</h1>
</div>
</header>

<main>

<div class="search">
<input type="text" placeholder="Find a recipe">
<button>
<img src="images/search.png" alt="search">
</button>
</div>

<div class="recipe">

<img src="images/apple-crisp.jpg" alt="Apple Crisp">

<div class="recipe-info">

<p class="tag">dessert</p>

<h2>Apple Crisp</h2>

<span
class="rating"
role="img"
aria-label="Rating: 4 out of 5 stars"
>
<span aria-hidden="true">⭐</span>
<span aria-hidden="true">⭐</span>
<span aria-hidden="true">⭐</span>
<span aria-hidden="true">⭐</span>
<span aria-hidden="true">☆</span>
</span>

<p class="description">
This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
</p>

</div>
</div>

</main>

<footer>

<a href="https://www.flaticon.com/free-icons/recipe">
Recipe icons created by Freepik - Flaticon
</a>

<div class="social">

<!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->

<a href="#"><img src="images/instagram_icon.png" alt="instagram"></a>
<a href="#"><img src="images/youtube_icon.png" alt="youtube"></a>
<a href="#"><img src="images/pinterest_icon.png" alt="pinterest"></a>

</div>

</footer>

</body>
</html>
